# Every field here maps 1:1 to a dataclass in src/codeqa/config.py.
# Anything you omit falls back to the dataclass default.
# Other config files can start with `extends: default.yaml` and override only what changes.
repos_dir: repos
artifacts_dir: artifacts
results_dir: results           # results/<tag>/...  (see --tag in the scripts)
reports_dir: reports           # reports/<tag>/...

chunk:
  max_class_lines: 80          # classes longer than this are split into a header chunk + one chunk per method
  window: 40                   # docs/config files: lines per window
  overlap: 10                  #                    lines shared by consecutive windows
  include_module_code: false   # ablation: also index top-level statements that sit after the first def

embed:
  model: Qwen/Qwen3-Embedding-0.6B   # instruction-aware, trained on text + code; 'hashing' = offline stand-in
  max_chars: 4000              # characters of "<path> <name>\n<code>" embedded per chunk (99% of Flask chunks fit)
  max_seq_length: 1024         # token cap inside the embedder (keeps batches small on a T4)
  batch_size: 16
  trust_remote_code: false
  # Questions are prefixed with this instruction; chunks are embedded as they are (Qwen3-Embedding's recommended use).
  query_prompt: "Instruct: Given a question about a Python code repository, retrieve the code or documentation that answers it\nQuery:"

retrieval:
  k: 6                         # baseline: plain top-k (textbook RAG, about half the budget)
  context_char_budget: 18000   # baseline_budget + structure: fill up to this many characters of context
  per_chunk_chars: 3000        # each chunk is truncated to this many characters in the prompt
  pool: 60                     # how many semantic hits to consider as candidates
  k_seed: 4                    # structure: seeds that are always kept and expanded through the graph
  seed_from: code              # structure: 'code' = seeds are the top Python chunks (docs have no edges); 'any'
  max_expansion: 8             # structure: max chunks added because of graph edges
  reserve_expansion: 4         # structure: best graph neighbours placed right after the seeds (0 = compete on score)
  max_in_edges: 20             # structure: "called_by" neighbours per seed, the most question-similar ones
  alpha: 0.5                   # weight of the seed's score vs. the neighbour's own similarity to the question
  edge_weights:
    call: 1.0
    ref: 0.8
    called_by: 0.7
    parent: 0.9
    header: 0.4

llm:                           # the generator; identical for every strategy (fair comparison)
  backend: hf                  # hf | gemini | anthropic | echo
  model: Qwen/Qwen2.5-Coder-3B-Instruct
  max_new_tokens: 700
  thinking_budget: 0           # Gemini 2.x only; 0 = no hidden "thinking" tokens eating max_new_tokens

judge:                         # should be a DIFFERENT model family from the generator
  backend: gemini              # gemini | anthropic | hf | echo
  model: gemini-3.5-flash-lite # free tier: 15 requests/min, 500/day (3.8 Flash: 5/min, 20/day); a full judge
                               # run is ~336 requests. Google retires models: see
                               # `python scripts/list_gemini_models.py flash`; JUDGE_MODEL overrides for one run
  max_new_tokens: 600          # visible reply; Gemini 3 thinking gets extra room on top
  thinking_level: low          # Gemini 3+: minimal | low | medium | high (thinking cannot be switched off)
  thinking_budget: null        # Gemini 2.x only (0 = thinking off); never sent together with thinking_level
  requests_per_minute: 14      # stay just under the free tier's 15/min; set null when billing is on
